name: Generate Daily Blog Post

on:
  schedule:
    - cron: '0 1 * * *'  # Runs at 01:00 UTC (9:00 AM Beijing time) daily
  workflow_dispatch:     # Allows manual trigger in the GitHub UI

permissions:
  contents: write        # Grants write permission to push commits to the repository

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run blog generator script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python scripts/generate_blog.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add posts/ data/blogs.json feed.xml
        # Check if there are changes before committing
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-publish daily blog post" && git push)
